[project]
name = "isograph"
version = "0.1.0"
description = "A Python framework for discovering isoform-switch and splicing modules from bulk RNA-seq by combining gene-local compositional modeling with splice-graph-aware latent network inference."
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = { file = "LICENSE" }
authors = [
    { name = "Kynon J Benjamin", email = "kj.benjamin90@gmail.com" }
]
keywords = [
    "RNA-seq", "isoform switching", "splicing", "co-expression",
    "network inference", "bioinformatics", "transcriptomics", "vae",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "hydra-core>=1.3,<2",
    "networkx>=3.3,<4",
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "pyarrow>=17,<25",
    "pydantic>=2.8,<3",
    "PyYAML>=6,<7",
    "scikit-learn>=1.5,<2",
    "scipy>=1.13,<2",
]

[project.optional-dependencies]
torch = [
    "torch>=2.0",
]
dev = [
    "hypothesis>=6.112,<7",
    "mlflow-skinny>=2.16,<3",
    "pytest>=8.3,<9",
]
docs = [
    "myst-parser>=3,<4",
    "sphinx>=7,<8",
    "sphinx-autodoc-typehints>=2,<3",
    "sphinx-rtd-theme>=3,<4",
]

[project.urls]
Homepage = "https://github.com/heart-gen/IsoGraph"
Repository = "https://github.com/heart-gen/IsoGraph"
Documentation = "https://isograph.readthedocs.io/en/latest/"
"Bug Tracker" = "https://github.com/heart-gen/IsoGraph/issues"

[project.scripts]
isograph = "isograph.workflow.cli:main"

[tool.poetry]
packages = [{ include = "isograph", from = "src" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["slow: marks tests as slow (skipped in fast CI runs)"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "C4"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
