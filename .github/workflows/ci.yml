name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]
      - name: Run fast tests (no torch required)
        run: pytest -m "not slow" --ignore=tests/test_stage4_gates.py --ignore=tests/test_stage6_gates.py --ignore=tests/test_stage7_gates.py

  test-torch:
    name: Tests with PyTorch (Python 3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package with torch
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]
          pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Run fast torch gate tests
        run: pytest -m "not slow" tests/test_stage4_gates.py tests/test_stage6_gates.py tests/test_stage7_gates.py
