name: isograph
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - mpmath
  - numpy
  - pandas
  - pyarrow
  - scipy
  - scikit-learn
  - networkx
  - pip:
      # PyTorch is intentionally not installed here; install a build
      # appropriate for the local CPU/GPU/CUDA stack before using VAE or
      # GPU-latent backends.
      - -e .[dev]
