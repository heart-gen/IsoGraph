defaults:
  - _self_

command: benchmark
dataset_suite: core_v1
stage_name: stage1_baseline
backend: baseline
fixture_filter: null
benchmark_root: benchmarks
artifacts_root: artifacts
dataset_root: benchmarks/datasets
report_root: artifacts/reports
tracking_uri: null
seed: 7
recovery_thresholds:
  toy_v1: 1.0
  medium_v1: 0.875
latent:
  name: latent_network
  n_components: 10
  n_components_grid:
    - 2
    - 3
    - 4
    - 5
    - 6
    - 7
    - 8
    - 9
    - 10
    - 12
    - 15
    - 20
  alpha: 0.05
  min_module_size: 2
  max_iter: 1000
  tol: 1.0e-4
  residualize_covariates:
    - RIN
    - PMI
    - mito_mapping_rate
    - percent_assigned
  trait_columns:
    - Dx
    - Age

fixture_latent_overrides:
  toy_v1:
    alpha: 0.05
    min_module_size: 2
  medium_v1:
    alpha: 0.01
    min_module_size: 2
  realistic_v1:
    alpha: 0.02
    min_module_size: 2
  realistic_unequal_v1:
    alpha: 0.02
    min_module_size: 2

fixture_model_overrides:
  toy_v1:
    alpha: 0.05
    min_module_size: 2
  medium_v1:
    alpha: 0.02
    min_module_size: 2
real_data:
  counts_root: data/counts
  annotations_root: data/annotations
  phenotype_tsv: data/phenotypes.tsv
  ancestry_tsv: data/ancestry.txt
  output_name: real_caudate_aa_v1
  gene_panel_size: 256
  cache_root: benchmarks/cache/real_data
  allowed_diagnoses:
    - Control
    - SCZD
model:
  name: baseline_network
  alpha: 0.12
  min_module_size: 3
  max_modules: 64
  residualize_covariates:
    - RIN
    - PMI
    - mito_mapping_rate
    - percent_assigned
  trait_columns:
    - Dx
    - Age
